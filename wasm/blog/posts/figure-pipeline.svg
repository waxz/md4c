<svg xmlns="http://www.w3.org/2000/svg" width="640" height="170" viewBox="0 0 640 170" font-family="Georgia, 'Times New Roman', serif" font-size="15">
  <rect width="640" height="170" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#46464b"/>
    </marker>
  </defs>
  <g fill="none" stroke="#2a2a2d" stroke-width="1.3">
    <rect x="16" y="50" width="150" height="62" rx="4"/>
    <rect x="245" y="50" width="150" height="62" rx="4"/>
    <rect x="474" y="50" width="150" height="62" rx="4"/>
  </g>
  <g stroke="#46464b" stroke-width="1.3" marker-end="url(#a)">
    <line x1="168" y1="81" x2="241" y2="81"/>
    <line x1="397" y1="81" x2="470" y2="81"/>
  </g>
  <g fill="#1d1d1f" text-anchor="middle">
    <text x="91" y="78">posts/*.md</text>
    <text x="91" y="98" font-size="12" fill="#6b6a66">R2, read-only URL</text>
    <text x="320" y="78">md4c.wasm</text>
    <text x="320" y="98" font-size="12" fill="#6b6a66">in the reader’s browser</text>
    <text x="549" y="78">HTML</text>
    <text x="549" y="98" font-size="12" fill="#6b6a66">sanitised by DOMPurify</text>
  </g>
  <text x="320" y="30" text-anchor="middle" font-size="13" fill="#8b1e2d" letter-spacing="2">FETCH → PARSE → RENDER</text>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#6b6a66">No server-side code runs at any step.</text>
</svg>
