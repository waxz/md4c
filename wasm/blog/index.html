<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Static hosts like R2 cannot add response headers, so the policy is set
     here. 'wasm-unsafe-eval' only allows compiling md4c.wasm. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' https: data:; media-src 'self' https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>MD4C Blog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b6bcb'/%3E%3Cpath d='M3 12V4l2.5 3L8 4v8M10 9l2 3 2-3M12 4v8' stroke='white' fill='none' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#/">MD4C Blog</a>
    <nav id="nav">
      <a href="#/">Posts</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite">
  <p class="muted">Loading…</p>
</main>

<footer class="site-footer">
  <div class="wrap">
    Markdown rendered in your browser by <strong>MD4C</strong> compiled to WebAssembly.
    Posts are read through <strong>storagesdk</strong> from read-only storage.
  </div>
</footer>
</body>
</html>
